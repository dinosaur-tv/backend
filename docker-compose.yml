services:
  dino-backend:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - dino

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - dino-backend
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dino

networks:
  dino:

volumes:
  caddy_data:
  caddy_config:
